services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      BACKUPFORGE_DATABASE_URL: postgresql+psycopg://backupforge:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/backupforge
      BACKUPFORGE_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes:
      - backupforge-data:/var/lib/backupforge
      # Mount only explicitly trusted backup roots, read-only where possible.
      - ${BACKUP_SOURCE_PATH:?set in .env}:/data:ro
      - backupforge-restore:/restore
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      volume-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
  worker:
    build: .
    command: celery -A backend.app.worker.celery_app worker --loglevel=INFO
    env_file:
      - path: .env
        required: false
    environment:
      BACKUPFORGE_DATABASE_URL: postgresql+psycopg://backupforge:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/backupforge
      BACKUPFORGE_REDIS_URL: redis://redis:6379/0
    volumes:
      - backupforge-data:/var/lib/backupforge
      - ${BACKUP_SOURCE_PATH:?set in .env}:/data:ro
    depends_on:
      api: { condition: service_healthy }
  beat:
    build: .
    command: celery -A backend.app.worker.celery_app beat --loglevel=INFO
    env_file:
      - path: .env
        required: false
    environment:
      BACKUPFORGE_DATABASE_URL: postgresql+psycopg://backupforge:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/backupforge
      BACKUPFORGE_REDIS_URL: redis://redis:6379/0
    volumes:
      - backupforge-data:/var/lib/backupforge
    depends_on:
      api: { condition: service_healthy }
  volume-init:
    build: .
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/var/lib/backupforge", "/restore"]
    volumes:
      - backupforge-data:/var/lib/backupforge
      - backupforge-restore:/restore
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backupforge
      POSTGRES_DB: backupforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backupforge -d backupforge"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
volumes:
  backupforge-data:
  postgres-data:
  redis-data:
  backupforge-restore:
