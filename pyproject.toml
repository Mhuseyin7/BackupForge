[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "backupforge"
version = "0.1.0"
description = "Verification-first, self-hosted backup orchestration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3", "cryptography>=43,<45",
  "celery[redis]>=5.4,<6", "redis>=5.0,<6", "boto3>=1.35,<2", "zstandard>=0.23,<1",
  "croniter>=3,<4", "PyJWT>=2.9,<3", "argon2-cffi>=23.1,<24", "alembic>=1.13,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["backend*"]
